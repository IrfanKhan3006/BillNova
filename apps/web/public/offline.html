<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You are offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 24px; text-align: center; background: #f8fafc; color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #f4f4f5; } }
      .dot { width: 54px; height: 54px; border-radius: 16px; background: #10b981; margin: 0 auto 20px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { margin: 0 0 22px; opacity: .75; max-width: 28rem; line-height: 1.6; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 10px;
        background: #10b981; color: #052e1f; padding: 11px 20px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1>No internet connection</h1>
      <p>Your bills and customers are safe on the server. Reconnect and try again — nothing was lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
